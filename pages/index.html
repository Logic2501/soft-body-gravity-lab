<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Soft Body Lab：选择原型或水流版本。">
  <meta name="theme-color" content="#070b14">
  <title>Soft Body Lab · 选择版本</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b14;
      --panel: #0d1929;
      --border: rgba(118, 214, 226, 0.2);
      --text: #e6f4f5;
      --muted: #8ca9b4;
      --accent: #5cf0c0;
      --water: #68d8e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 18% 8%, rgba(64, 206, 184, 0.1), transparent 34rem),
        radial-gradient(circle at 86% 90%, rgba(104, 216, 232, 0.1), transparent 30rem),
        var(--bg);
    }

    main {
      width: min(900px, 100%);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 64px);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .intro {
      max-width: 520px;
      margin: 18px 0 34px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .versions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      position: relative;
      display: flex;
      min-height: 220px;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      overflow: hidden;
      color: var(--text);
      text-decoration: none;
      background: linear-gradient(145deg, rgba(22, 42, 62, 0.9), rgba(10, 20, 32, 0.96));
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.24);
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .card::after {
      position: absolute;
      right: -50px;
      bottom: -70px;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(92, 240, 192, 0.16), transparent 68%);
      content: "";
      pointer-events: none;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-4px);
      border-color: rgba(92, 240, 192, 0.55);
      outline: none;
    }

    .card-water {
      border-color: rgba(104, 216, 232, 0.32);
      background: linear-gradient(145deg, rgba(23, 55, 76, 0.94), rgba(9, 22, 36, 0.98));
    }

    .card-water::after {
      background: radial-gradient(circle, rgba(104, 216, 232, 0.24), transparent 68%);
    }

    .card-water:hover,
    .card-water:focus-visible {
      border-color: rgba(104, 216, 232, 0.85);
    }

    .badge {
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 5px 9px 4px;
      color: #04171c;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.14em;
      background: linear-gradient(135deg, #b8fff2, #5ce8f3);
      border-radius: 999px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.42) inset,
        0 0 22px rgba(92, 232, 243, 0.52);
      animation: badge-pulse 2.4s ease-in-out infinite;
    }

    .label {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .card-water .label {
      color: var(--water);
    }

    .card strong {
      display: block;
      max-width: 260px;
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.12;
      letter-spacing: -0.03em;
    }

    .meta {
      position: relative;
      z-index: 1;
      margin-top: 28px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    footer {
      margin-top: 26px;
      color: rgba(140, 169, 180, 0.72);
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    @keyframes badge-pulse {
      0%, 100% {
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.42) inset,
          0 0 18px rgba(92, 232, 243, 0.36);
      }
      50% {
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.7) inset,
          0 0 30px rgba(92, 232, 243, 0.72);
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 24px 16px;
      }

      .versions {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 180px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card,
      .badge {
        animation: none;
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Soft Body Lab</p>
    <h1>选择版本</h1>
    <p class="intro">两个独立的静态软体实验。原型偏向重力与中心引力；水流版偏向合并、临界分离与水龙头。</p>

    <div class="versions">
      <a class="card" href="./prototype/">
        <span>
          <span class="label">Prototype</span>
          <strong>软体引力原型</strong>
        </span>
        <span class="meta">重力 · 中心引力 · 多软体 · 参数调校</span>
      </a>

      <a class="card card-water" href="./water/">
        <span class="badge">NEW</span>
        <span>
          <span class="label">Water</span>
          <strong>软体水流版</strong>
        </span>
        <span class="meta">水龙头 · 合并 · 临界分离 · 8 质点水滴</span>
      </a>
    </div>

    <footer>Static Web · zero build · GitHub Pages</footer>
  </main>
</body>
</html>

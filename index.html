<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="单软体在重力、中心引力、惯性与封闭边界碰撞下的实时形变实验。">
  <meta name="theme-color" content="#070b14">
  <title>软体引力实验</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app">
    <main class="stage" aria-label="软体物理实验场景">
      <div class="canvas-frame">
        <canvas id="scene" aria-label="软体物理实验画布"></canvas>
      </div>
    </main>

    <aside class="panel" aria-label="实验参数控制面板">
      <header class="panel-header">
        <h1>软体引力实验</h1>
        <p class="subtitle">质点环 · PBD 约束 · 固定 240 Hz</p>
      </header>

      <div id="params" class="params"></div>
      <p id="param-help" class="param-help" aria-live="polite"></p>

      <div class="actions">
        <button id="pause" type="button">暂停</button>
        <button id="reset" type="button">重置实验</button>
      </div>
      <button id="defaults" class="wide-button" type="button">恢复推荐参数</button>

      <label class="debug-toggle">
        <input id="debug" type="checkbox">
        <span>显示质点与弹簧</span>
      </label>

      <label class="debug-toggle">
        <input id="equipotential" type="checkbox" checked>
        <span>显示等势能线</span>
      </label>

      <p id="status" class="status">运行中 · 重力 + 中心引力</p>
      <p id="metrics" class="metrics">最大速度 — · 面积误差 —</p>

      <p class="hint">
        拖动软体轮廓：对最近质点施加有限拖拽力<br>
        松开后恢复纯物理模拟<br>
        空格 暂停/继续 · R 重置<br>
        边缘/弯曲/面积调到 0 可深度折叠<br>
        轮廓平滑调到 0 显示原始折痕<br>
        数值框支持精确输入，非法值自动还原
      </p>

      <p class="build-note">静态 Web · 双击本页即可运行 · 可部署 GitHub Pages</p>
    </aside>
  </div>

  <noscript>此实验需要启用 JavaScript。</noscript>
  <script src="src/soft_body_sim.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
